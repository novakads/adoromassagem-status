# Página pública de status da Adoro Massagem (status.adoromassagem.com).
owner: novakads
repo: adoromassagem-status

sites:
  - name: Site
    url: https://adoromassagem.com
    maxResponseTime: 5000
  - name: Busca de profissionais
    url: https://adoromassagem.com/salvador/relaxante
    maxResponseTime: 5000
  - name: Entrar na conta
    url: https://adoromassagem.com/entrar
    maxResponseTime: 5000
  # Depois da publicação do sistema v2, ligar também a verificação interna (banco e serviços):
  # - name: Sistema
  #   url: https://adoromassagem.com/api/health
  #   maxResponseTime: 5000

status-website:
  cname: status.adoromassagem.com
  name: Adoro Massagem · Status
  logoUrl: https://raw.githubusercontent.com/novakads/adoromassagem-status/master/assets/logo.png
  favicon: https://raw.githubusercontent.com/novakads/adoromassagem-status/master/assets/favicon.png
  faviconSvg: https://raw.githubusercontent.com/novakads/adoromassagem-status/master/assets/favicon.svg
  theme: light
  introTitle: "**Status da Adoro Massagem**"
  introMessage: Acompanhe aqui, em tempo real, se o site está funcionando. Verificamos a cada 5 minutos. Em caso de problema, publicamos as atualizações nesta página.
  navbar:
    - title: Status
      href: /
    - title: Ir para o site
      href: https://adoromassagem.com
  robotsText: "User-agent: *\nAllow: /"
  css: |
    body, input, button { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    body { background: #FAF9F7; color: #17151A; }
    a { color: #B3105C; }
    a:hover { color: #E5197B; }

